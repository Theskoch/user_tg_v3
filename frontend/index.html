<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <link rel="stylesheet" href="styles.css?v=2026-02-20-4">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <base href="/">
</head>
<body>
    <div id="debug-panel" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#111; color:#0f0; font-size:12px; padding:6px; z-index:9999; white-space:pre-wrap;"></div>
    <div id="login-page" class="page">
        <div class="login-container">
            <h2>Введите код доступа</h2>
            <input type="text" id="access-code" placeholder="Код">
            <button id="login-btn">Войти</button>
            <div id="error-message" class="error"></div>
        </div>
    </div>

    <div id="user-page" class="page hidden">
        <header>
            <div class="user-avatar" id="user-initial"></div>
            <button class="balance" id="user-balance" type="button">0 ₽</button>
            <div class="menu-icon" id="menu-toggle">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </header>

        <div id="side-menu" class="side-menu hidden">
            <button id="replenish-btn">Пополнить</button>
            <button id="admin-btn" class="hidden">Администратор</button>
        </div>

        <div class="connections-list">
            <h3>Мои подключения</h3>
            <div id="connections" class="connections-grid"></div>
        </div>
    </div>

    <div id="topup-page" class="page hidden">
        <header>
            <div class="user-avatar" id="user-initial-topup"></div>
            <button class="balance" id="user-balance-topup" type="button">0 ₽</button>
            <button id="topup-back" class="icon-btn" type="button">←</button>
        </header>

        <div class="card glass">
            <h3>Способы пополнения</h3>
            <div class="pay-methods">
                <button class="pay-card">Crypto</button>
                <button class="pay-card">Stars</button>
                <button class="pay-card">Перевод</button>
            </div>
        </div>
    </div>

    <div id="sheet-overlay" class="sheet-overlay hidden"></div>
    <div id="sheet" class="sheet hidden">
        <div class="sheet-handle"></div>
        <h4 id="sheet-title">Подключение</h4>
        <div id="sheet-qr" class="sheet-qr"></div>
        <div class="sheet-text-row">
            <div id="sheet-text" class="sheet-text" contenteditable="true"></div>
            <button id="copy-config" class="icon-btn icon-copy" type="button" aria-label="Copy">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="10" height="10" rx="2"></rect>
                    <rect x="5" y="5" width="10" height="10" rx="2"></rect>
                </svg>
            </button>
        </div>
        <button id="close-sheet" class="btn ghost">Закрыть</button>
    </div>

    <div id="admin-page" class="page hidden">
        <h1>Панель администратора</h1>
        <p>Функционал в разработке</p>
    </div>

    <script src="app.js?v=2026-02-20-6"></script>
</body>
</html>
